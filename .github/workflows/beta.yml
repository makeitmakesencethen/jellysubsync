name: beta

# Builds the `beta` branch into a testable plugin zip and attaches it to a
# GitHub PRE-RELEASE. Deliberately publishes NO catalog: a second catalog would
# show up as a second entry in everyone's plugin list (same plugin GUID), which
# is confusing. Test builds are therefore pulled deliberately:
#
#   Local test (your own Jellyfin):
#     unzip the attached asset, then copy its contents into the installed plugin
#     folder and restart Jellyfin (see CONTRIBUTING.md — "Testing without
#     publishing to everyone").
#
# Promotion to stable stays: merge `beta` into `master`, bump version +
# CHANGELOG, tag vX.Y.Z → the stable release workflow publishes the catalog.

on:
  push:
    branches: ['beta']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.SubSync/Jellyfin.Plugin.SubSync.csproj
      - name: Build
        run: dotnet build Jellyfin.Plugin.SubSync/Jellyfin.Plugin.SubSync.csproj --configuration Release --no-restore

      - name: Build bundled ffsubsync binary (linux-x64)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/ffbuild
          /tmp/ffbuild/bin/pip install --quiet ffsubsync==0.5.1 pyinstaller
          mkdir -p /tmp/ffhooks
          curl -s https://raw.githubusercontent.com/smacke/ffsubsync/0.5.1/gui/hooks/hook-webrtcvad.py \
            -o /tmp/ffhooks/hook-webrtcvad.py
          cd /tmp
          /tmp/ffbuild/bin/python -m PyInstaller --noconfirm --onedir \
            --additional-hooks-dir /tmp/ffhooks --name ffsubsync \
            /tmp/ffbuild/bin/ffsubsync --distpath /tmp/ffbin
          test -x /tmp/ffbin/ffsubsync/ffsubsync

      - name: Package test zip
        shell: bash
        run: |
          set -euo pipefail
          VER="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Jellyfin.Plugin.SubSync/Jellyfin.Plugin.SubSync.csproj | head -1)"
          mkdir -p staging dist
          cp Jellyfin.Plugin.SubSync/bin/Release/net9.0/Jellyfin.Plugin.SubSync.dll staging/
          cp Jellyfin.Plugin.SubSync/meta.json staging/
          mkdir -p "staging/ffsubsync/linux-x64"
          cp -r /tmp/ffbin/ffsubsync/ffsubsync "staging/ffsubsync/linux-x64/ffsubsync"
          cp -r /tmp/ffbin/ffsubsync/_internal "staging/ffsubsync/linux-x64/_internal"
          (cd staging && zip -q -r "../dist/Jellyfin.Plugin.SubSync_${VER}-test.zip" .)
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Attach as pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}-test.${{ github.run_number }}
          name: "SubSync ${{ env.VER }} (test build ${{ github.run_number }})"
          prerelease: true
          body: |
            Automated test build from the `beta` branch (commit ${{ github.sha }}).

            Not published to the plugin catalog — install it manually for testing
            and report what you find.

            ${{ github.event.head_commit.message }}
          files: dist/Jellyfin.Plugin.SubSync_*.zip
