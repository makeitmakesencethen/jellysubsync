<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>SubSync</title>
</head>
<body>
    <!--
        The dashboard used to carry a second, partial copy of these settings (its own subset of the
        same configuration), so two pages disagreed about what was stored. Merged 2026-09-11: the
        plugin's own page is the single place these settings live, and this page points at it.

        Nothing here calls the API, so nothing here needs a token.

        The target is the *page* URL, not a hash route: in Jellyfin 12 `#/configurationpage?name=…`
        is sent straight back to `#/home` (measured), while `/web/configurationpage?name=…` renders
        the plugin page.
    -->
    <div id="SubSyncPointerPage" data-role="page" class="page type-interior pluginConfigurationPage">
        <div data-role="content">
            <div class="content-primary">
                <div class="verticalSection">
                    <div class="sectionTitleContainer flex align-items-center">
                        <h2 class="sectionTitle">SubSync</h2>
                    </div>
                    <p class="sectionDescription">
                        SubSync's settings now live on the plugin's own page, so there is one place that
                        reads and writes them instead of two that disagree.
                    </p>
                    <p>
                        <a id="SubSyncOpenMain" class="raised button-link emby-button" href="/web/configurationpage?name=subsync-main">
                            <span>Open SubSync settings</span>
                        </a>
                    </p>
                    <p id="SubSyncPointerNote" class="fieldDescription">
                        Opening it now&hellip; if nothing happens, use the button above, or the SubSync
                        entry in the main menu.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        (function () {
            'use strict';

            // The plugin page is served from the same origin as the web client, so this page can be
            // pointed at it directly. Top first (this page loads inside the dashboard's dialog), the
            // link above is the fallback when a browser refuses the navigation. The page URL, not a
            // hash route: Jellyfin 12 turns `#/configurationpage?name=…` into `#/home`.
            var TARGET = '/web/configurationpage?name=subsync-main';

            function go() {
                try {
                    if (window.top && window.top.location) {
                        window.top.location.href = TARGET;
                        return;
                    }
                } catch (e) { /* cross-origin or blocked: the link is the way */ }

                try { window.location.href = TARGET; }
                catch (e) { /* the link is still there */ }
            }

            if (document.readyState === 'complete' || document.readyState === 'interactive') {
                setTimeout(go, 600);
            } else {
                document.addEventListener('DOMContentLoaded', function () { setTimeout(go, 600); });
            }
        })();
    </script>
</body>
</html>
